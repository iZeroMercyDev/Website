name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Only needed so `prisma generate` can read the schema; no database is contacted.
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      # `next build` is verified by the Vercel deployment, so it is not repeated here.
